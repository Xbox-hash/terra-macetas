version: '3.8'

services:
  # 1. Base de datos PostgreSQL para Evolution API (manejo de sesiones y estados)
  evolution-postgres:
    image: postgres:15-alpine
    container_name: terra-evolution-db
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution_user
      POSTGRES_PASSWORD: EvolutionSecretPassword2026!
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - terra-network

  # 2. Gateway Evolution API (WhatsApp Autónomo)
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: terra-evolution-api
    restart: always
    depends_on:
      - evolution-postgres
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=TerraSecretApiKey2026_WhatsAppGateway!
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://evolution_user:EvolutionSecretPassword2026!@evolution-postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_MESSAGE_HISTORIC=true
      - DEL_INSTANCE=false
    networks:
      - terra-network

volumes:
  evolution_db_data:

networks:
  terra-network:
    driver: bridge
