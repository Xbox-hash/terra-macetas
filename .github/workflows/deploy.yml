name: CI/CD - Donna Botanica Deploy

on:
  push:
    branches:
      - master
      - main
      - test
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente a desplegar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - production
          - test

jobs:
  deploy:
    name: 🚀 Deploy al VPS Contabo
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚡ Despliegue en el Servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '86.48.21.7' }}
          username: ${{ secrets.VPS_USER || 'nelson' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Qué desplegar:
            #  - push a master/main  -> producción (+ servicios compartidos: SQL Server y Evolution)
            #  - push a test         -> solo el ambiente de test (terra_api_test / terra_front_test)
            #  - ejecución manual    -> lo elegido en "target" (all = ambos)
            TARGET="${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'test' && 'test' || 'production') }}"

            REPO_URL="https://github.com/Xbox-hash/terra-macetas.git"
            PROD_DIR="/opt/terra-macetas"
            TEST_DIR="/opt/terra-macetas-test"
            # Mismo nombre de proyecto para los dos: así compose maneja los contenedores
            # y volúmenes que ya existen (terra-macetas_terra_uploads_test, etc.)
            PROJECT="terra-macetas"
            # Secretos: un único .env que vive solo en el servidor (nunca en git)
            ENV_ARGS=""
            if [ -f "$PROD_DIR/.env" ]; then ENV_ARGS="--env-file $PROD_DIR/.env"; fi

            echo "=========================================================="
            echo "🚀 Despliegue de Donna Botánica en Contabo VPS (target: $TARGET)"
            echo "=========================================================="

            # Clona o actualiza una carpeta del servidor a la última versión de una rama
            sync_repo() {
              local dir="$1" branch="$2"
              if [ ! -d "$dir" ]; then
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p "$dir"
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chown -R $(whoami):$(whoami) "$dir"
              fi
              if [ ! -d "$dir/.git" ]; then
                echo "📦 Clonando $branch en $dir..."
                git clone "$REPO_URL" "$dir"
              fi
              cd "$dir"
              git fetch origin "$branch"
              git reset --hard "origin/$branch"
              echo "📌 $dir en $branch @ $(git rev-parse --short HEAD)"
            }

            # ---------- PRODUCCIÓN (rama master) ----------
            if [ "$TARGET" = "production" ] || [ "$TARGET" = "all" ]; then
              sync_repo "$PROD_DIR" master
              cd "$PROD_DIR"

              echo "🐳 Levantando producción y servicios compartidos..."
              docker rm -f terra_front_prod 2>/dev/null || true
              for net in $(docker network ls --filter name=terra-macetas -q 2>/dev/null); do
                for c in $(docker network inspect $net -f '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null); do
                  docker network disconnect -f $net $c 2>/dev/null || true
                done
                docker network rm $net 2>/dev/null || true
              done
              docker network disconnect -f terra-macetas_terra_network terra_evolution_db 2>/dev/null || true
              # Solo servicios de producción: el ambiente de test se despliega desde su propia rama
              docker compose -p "$PROJECT" $ENV_ARGS -f docker-compose.server.yml up -d --build --remove-orphans                 terra_sqlserver terra_evolution_db terra_evolution_api terra_api_prod terra_front_prod
            fi

            # ---------- TEST (rama test) ----------
            if [ "$TARGET" = "test" ] || [ "$TARGET" = "all" ]; then
              sync_repo "$TEST_DIR" test
              cd "$TEST_DIR"

              echo "🧪 Levantando ambiente de test..."
              docker rm -f terra_front_test 2>/dev/null || true
              # --no-deps: no toca SQL Server, Evolution ni producción
              docker compose -p "$PROJECT" $ENV_ARGS -f docker-compose.server.yml up -d --build --no-deps                 terra_api_test terra_front_test
            fi

            # Conectar el contenedor Caddy a terra_network para resolución interna
            docker network connect terra_network nelson-caddy 2>/dev/null || true

            # Caddy, túnel y cron son de infraestructura compartida: solo en despliegues de producción
            if [ "$TARGET" = "test" ]; then
              echo "=========================================================="
              echo "🎉 Test desplegado: https://test.donnabotanica.com.py"
              echo "=========================================================="
              exit 0
            fi

            # Integrar con Caddy asegurando conexión directa a contenedores
            if [ -f "/opt/app-nelson/Caddyfile" ]; then
              echo "🌐 Actualizando configuración de Caddy para Donna Botánica..."
              cp /opt/app-nelson/Caddyfile /opt/app-nelson/Caddyfile.bak
              sed -i '/DONNA BOTANICA/,$d' /opt/app-nelson/Caddyfile
              sed -i '/donnabotanica/,$d' /opt/app-nelson/Caddyfile
              cat "$PROD_DIR/Caddyfile.snippet" >> /opt/app-nelson/Caddyfile
              docker exec -i nelson-caddy sh -c "cat > /etc/caddy/Caddyfile" < /opt/app-nelson/Caddyfile
              docker exec nelson-caddy caddy reload --config /etc/caddy/Caddyfile || true
              echo "✅ Caddy actualizado y recargado con éxito."
            fi

            # 6. Asegurar contenedor de Cloudflare Tunnel activo
            echo "🚇 Verificando Cloudflare Tunnel..."
            docker rm -f cloudflared 2>/dev/null || true
            docker run -d --name cloudflared --restart always --network host \
              cloudflare/cloudflared:latest tunnel --no-autoupdate run --token eyJhIjoiMDAzNTg4NGEzN2Q4MGM4YzA5NjgzMjFiNGUyZWIzMWMiLCJ0IjoiZTIxMDY2OTMtMzczMS00MTNjLWFjNjEtNWFjOTgxYmVhMjliIiwicyI6Ik9EYzROMlZoTkdZdE1HTXlNeTAwWTJObExXSXpOMll0WkRObVl6RTNObUl6T0RjdyJ9
            echo "✅ Cloudflare Tunnel conectado con éxito."

            # 7. Prevenir expiración del certificado SSL interno de Caddy (rotación automática)
            echo "⏰ Configurando renovación automática para certificados SSL de Caddy..."
            cat << 'EOF' > /opt/app-nelson/reload-caddy.sh
            #!/bin/bash
            if docker ps | grep -q nelson-caddy; then
              docker exec -i nelson-caddy sh -c "cat > /etc/caddy/Caddyfile" < /opt/app-nelson/Caddyfile 2>/dev/null || true
              docker exec nelson-caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true
            fi
            EOF
            sed -i 's/^[ \t]*//' /opt/app-nelson/reload-caddy.sh
            chmod +x /opt/app-nelson/reload-caddy.sh
            (crontab -l 2>/dev/null | grep -v "/opt/app-nelson/reload-caddy.sh" ; echo "0 4 * * * /opt/app-nelson/reload-caddy.sh >/dev/null 2>&1") | crontab -
            (crontab -l 2>/dev/null | grep -v "@reboot /opt/app-nelson/reload-caddy.sh" ; echo "@reboot sleep 20 && /opt/app-nelson/reload-caddy.sh >/dev/null 2>&1") | crontab -
            echo "✅ Renovación automática y sincronización post-reboot activadas."

            echo "=========================================================="
            echo "🎉 ¡Despliegue finalizado con éxito!"
            echo "   Producción: https://donnabotanica.com.py"
            echo "   Test:       https://test.donnabotanica.com.py"
            echo "=========================================================="
